<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OGI Daily Employee Entry</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#0f1b2d;--mu:#64748b;--bd:#e2e8f0;--ac:#2563eb;--sb:#0f1b2d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui}#app{display:flex;min-height:100vh}aside{width:236px;background:var(--sb);color:#cbd5e1;padding:16px 10px;display:flex;flex-direction:column}nav a{display:block;color:#cbd5e1;padding:10px;border-radius:8px;text-decoration:none}nav a:hover{background:var(--ac);color:white}.logo{font-size:18px;font-weight:bold;color:white;padding:8px}.logo small{display:block;font-size:10px;color:#94a3b8}main{flex:1;min-width:0;padding:24px}.card,.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:16px 0}.kpi span{display:block;color:var(--mu);font-size:12px}.kpi b{font-size:23px}.g,.bar{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.g>*{flex:1;min-width:180px}label{display:flex;flex-direction:column;gap:5px;color:var(--mu);font-size:12px}input,select{padding:9px;border:1px solid var(--bd);border-radius:8px;font:inherit}button{padding:9px 14px;border:0;border-radius:8px;cursor:pointer;font:inherit}.b{background:var(--ac);color:white}.b2{background:white;border:1px solid var(--bd)}.danger{background:#fee2e2;color:#991b1b}.mu{color:var(--mu)}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--bd);white-space:nowrap}th{font-size:12px;color:var(--mu);background:#f8fafc}.tw{overflow:auto}.pill{padding:3px 8px;border-radius:20px;background:#e2e8f0}.green{background:#dcfce7;color:#166534}.amber{background:#fef3c7;color:#92400e}.timeline{border-left:2px solid var(--bd);padding-left:16px;margin-left:8px}.event{padding:6px 0}.event b{margin-left:8px}.login{max-width:420px;margin:8vh auto}.hidden{display:none!important}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111827;color:white;padding:10px 16px;border-radius:8px;display:none}@media(max-width:800px){#app{display:block}aside{width:auto}main{padding:14px}}
</style></head><body><div id="app"><aside><div class="logo">OGI<small>TECHNOLOGIES</small></div><nav id="nav"></nav><div style="margin-top:auto"><p id="who"></p><button id="logout" class="b2 hidden">Log out</button></div></aside><main id="main">Loading…</main></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>t?new Date(t).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"—";
const dur=(a,b)=>a?Math.max(0,((b?new Date(b):new Date())-new Date(a))/36e5):0;
const hours=h=>{let m=Math.round(h*60);return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m"};
const today=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kolkata"}).format(new Date());
let user=null,boot=null,selectedDate=today(),poll=null,openNo=null;
async function api(a,m="GET",b=null,p={}){let u=new URL("/api/"+a,location.origin);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));let r=await fetch(u,{method:m,credentials:"same-origin",headers:b?{"content-type":"application/json"}:{},body:b?JSON.stringify(b):undefined});let x=null;try{x=await r.json()}catch{}if(!x)throw Error("Server not running. Start it with start.bat (or: node server.js) and open http://localhost:3000");if(!r.ok)throw Error(x.error||"Request failed");return x}
function toast(s){$("#toast").textContent=s;$("#toast").style.display="block";setTimeout(()=>$("#toast").style.display="none",3200)}
function loginView(){user=null;$("#who").textContent="";$("#logout").classList.add("hidden");$("#nav").innerHTML="";$("#main").innerHTML='<div class="login card"><h2>OGI Daily Employee Entry</h2><p class="mu">Secure sign in</p><div class="bar"><button id="empTab" class="b2">Employee</button><button id="adminTab" class="b2">Admin</button></div><div id="fields"><label>Employee Name<input id="empno" placeholder="Your name (or OGI-0001)"></label><br><label>Password<input id="pin" type="password"></label><br><button id="signin" class="b">Sign in</button></div></div>';let role="employee";$("#empTab").onclick=()=>{role="employee";fields()};$("#adminTab").onclick=()=>{role="admin";fields()};function fields(){let f=$("#fields");f.innerHTML=role==="admin"?'<label>Admin Password<input id="password" type="password"></label><br><button id="signin" class="b">Admin sign in</button>':'<label>Employee Name<input id="empno" placeholder="Your name (or OGI-0001)"></label><br><label>Password<input id="pin" type="password"></label><br><button id="signin" class="b">Sign in</button>';$("#signin").onclick=signin}$("#signin").onclick=signin;async function signin(){try{let b=role==="admin"?{role,password:$("#password").value}:{role,employeeNo:$("#empno").value,pin:$("#pin").value};let x=await api("login","POST",b);user=x.user;await load()}catch(e){toast(e.message)}}}
async function load(){boot=await api("bootstrap");user=boot.user;$("#who").textContent=user.role==="admin"?"Administrator":user.employeeNo+" · "+user.name;$("#logout").classList.remove("hidden");$("#nav").innerHTML=user.role==="admin"?'<a href="#monitor">EMPLOYEE LIVE ACTIVITY MONITORING</a><a href="#employees">Employee Management</a><a href="#reports">Reports</a>':'<a href="#myday">My Work Today</a>';render();if(poll)clearInterval(poll);poll=setInterval(()=>{if(["INPUT","SELECT"].includes(document.activeElement?.tagName))return;render()},user.role==="admin"?15000:60000)}
async function logout(){try{await api("logout","POST",{})}catch{}if(poll)clearInterval(poll);loginView()}$("#logout").onclick=logout;
function stat(t,v){return '<div class="kpi"><span>'+t+'</span><b>'+v+'</b></div>'}
function sessions(r){let w=r?.workSessions||[];return '<div class="tw"><table><tr><th>Work ID</th><th>Start</th><th>End</th><th>Duration</th></tr>'+w.map(x=>'<tr><td>'+esc(x.workId)+'</td><td>'+fmt(x.startAt)+'</td><td>'+fmt(x.endAt)+'</td><td>'+hours(dur(x.startAt,x.endAt))+'</td></tr>').join("")+'</table></div>'}
function timeline(r){return '<div class="timeline">'+(r?.events||[]).map(e=>'<div class="event"><b>'+fmt(e.at)+'</b><span>'+esc(e.type.replaceAll("_"," "))+(e.workId?" · "+esc(e.workId):"")+(e.dur!=null?" · "+hours(e.dur):"")+'</span></div>').join("")+'</div>'}
async function render(){if(!user)return;try{if(user.role==="employee")await employee();else{let page=(location.hash||"#monitor").slice(1);if(page==="employees")await employeeAdmin();else if(page==="reports")await reports();else await monitor()}}catch(e){$("#main").innerHTML='<div class="card">'+esc(e.message)+' <button onclick="render()" class="b2">Retry</button></div>'}}
async function employee(){boot=await api("bootstrap");let r=boot.record,ws=r?.workSessions||[],active=ws.find(w=>!w.endAt),br=r?.breaks||[],ids=boot.workIds||[],worked=ws.reduce((s,w)=>s+dur(w.startAt,w.endAt),0),breakTime=br.reduce((s,b)=>s+dur(b.startAt,b.endAt),0),logged=!!r&&r.status!=="LOGGED_OUT";
let kw=$("#wid")?.value,kn=$("#newid")?.value;$("#main").innerHTML='<h2>My Work Today</h2><p class="mu">'+today()+' · '+esc(user.name)+' ('+user.employeeNo+')</p><div class="kpis">'+stat("Attendance",r?.attendance||"Not marked")+stat("Status",r?.status||"Not logged in")+stat("Working Hours",hours(worked))+stat("Break Duration",hours(breakTime))+'</div><div class="card"><h3>Attendance & Work ID</h3>'+(!logged?'<button id="attend" class="b">Login / Mark Present</button>':'<p>Present · Login '+fmt(r.loginAt)+'</p><p>Current Work ID: <b>'+esc(active?.workId||"None")+'</b></p><div class="g"><label>Choose Work ID<select id="wid"><option value="">Select…</option>'+ids.map(x=>'<option>'+esc(x)+'</option>').join("")+'</select></label><label>Add another Work ID<span style="display:flex;gap:6px"><input id="newid" placeholder="New Work ID" style="flex:1"><button id="addid" class="b2" title="Add Another Work ID">+</button></span></label></div><div class="bar">'+(r.status==="WORKING"?'<button id="switch" class="b">Switch Work ID</button><button id="break" class="b2">Start Break</button><button id="close" class="b2">Close Work</button>':r.status==="ON_BREAK"?'<button id="resume" class="b">Resume Work</button>':'<button id="start" class="b">Start selected Work ID</button>')+'<button id="signout" class="b2 danger">Logout & Close Work</button></div>')+'</div><div class="card"><h3>Separate Work ID Sessions</h3>'+sessions(r)+'</div><div class="card"><h3>Activity Timeline</h3>'+timeline(r)+'</div>';if($("#wid")&&kw)$("#wid").value=kw;if($("#newid")&&kn)$("#newid").value=kn;
const act=async(type)=>{try{let id=$("#newid")?.value.trim()||$("#wid")?.value;if((type==="start"||type==="switch")&&!id)throw Error("Select or enter a Work ID.");if((type==="start"||type==="switch")&&$("#newid").value.trim())await api("work-ids","POST",{workId:id});await api("action","POST",{type,workId:id});toast("Saved with server timestamp.");await employee()}catch(e){toast(e.message)}};
if($("#addid"))$("#addid").onclick=async()=>{try{let v=$("#newid").value.trim();if(!v)throw Error("Enter a Work ID.");await api("work-ids","POST",{workId:v});$("#newid").value="";toast("Work ID added.");await employee();$("#wid").value=v}catch(e){toast(e.message)}};
if($("#attend"))$("#attend").onclick=async()=>{try{await api("action","POST",{type:"login"});await employee()}catch(e){toast(e.message)}};
[["start","start"],["switch","switch"],["break","break-start"],["resume","break-end"],["close","close-work"],["signout","logout"]].forEach(([id,type])=>{if($("#"+id))$("#"+id).onclick=()=>act(type)});
}
async function monitor(){let x=await api("activity","GET",null,{date:selectedDate}),es=x.employees||[],rs=x.day?.employees||{},recs=Object.values(rs),present=recs.filter(r=>r.attendance==="PRESENT"),working=recs.filter(r=>r.status==="WORKING"),breaks=recs.filter(r=>r.status==="ON_BREAK"),logged=recs.filter(r=>r.status==="LOGGED_OUT"),total=recs.reduce((s,r)=>s+(r.workSessions||[]).reduce((a,w)=>a+dur(w.startAt,w.endAt),0),0),q=$("#search")?.value.toLowerCase()||"";
let filtered=es.filter(e=>!q||e.name.toLowerCase().includes(q)||e.employeeNo.toLowerCase().includes(q)||(rs[e.employeeNo]?.workSessions||[]).some(w=>w.workId.toLowerCase().includes(q)));
$("#main").innerHTML='<h2>EMPLOYEE LIVE ACTIVITY MONITORING</h2><p class="mu">Live refresh every 15 seconds · '+selectedDate+'</p><div class="bar"><label>Date<input id="date" type="date" value="'+selectedDate+'"></label><label>Search name, employee number or Work ID<input id="search" value="'+esc(q)+'" placeholder="Search…"></label></div><div class="kpis">'+stat("Total Employees",es.length)+stat("Present",present.length)+stat("Absent",Math.max(0,es.filter(e=>e.active!==false).length-present.length))+stat("Currently Working",working.length)+stat("On Break",breaks.length)+stat("Logged Out",logged.length)+stat("Working Hours",hours(total))+'</div><div class="card"><h3>All Employees</h3><div class="tw"><table><tr><th>Employee</th><th>Employee No.</th><th>Attendance</th><th>Login</th><th>Current ID</th><th>All IDs Today</th><th>Status</th><th>Break Start–End</th><th>Total Break</th><th>Work Hours</th><th>Last Activity</th><th>Logout</th><th>Timeline</th></tr>'+filtered.map(e=>{let r=rs[e.employeeNo],w=r?.workSessions||[],br=(r?.breaks||[]).reduce((s,b)=>s+dur(b.startAt,b.endAt),0),wh=w.reduce((s,z)=>s+dur(z.startAt,z.endAt),0),id=w.map(z=>esc(z.workId)+" "+fmt(z.startAt)+"–"+(z.endAt?fmt(z.endAt):"now")+" ("+hours(dur(z.startAt,z.endAt))+")").join("<br>"),bl=(r?.breaks||[]).map(b=>fmt(b.startAt)+"–"+(b.endAt?fmt(b.endAt):"now")).join("<br>")||"—";return '<tr><td><a href="#monitor" class="detail" data-no="'+e.employeeNo+'"><b>'+esc(e.name)+'</b></a></td><td>'+e.employeeNo+'</td><td>'+(r?.attendance||"—")+'</td><td>'+fmt(r?.loginAt)+'</td><td>'+esc(r?.currentWorkId||"—")+'</td><td>'+(id||"—")+'</td><td><span class="pill '+(r?.status==="WORKING"?"green":r?.status==="ON_BREAK"?"amber":"")+'">'+(r?.status||"ABSENT")+'</span></td><td>'+bl+'</td><td>'+hours(br)+'</td><td>'+hours(wh)+'</td><td>'+fmt(r?.lastActivityAt)+'</td><td>'+fmt(r?.logoutAt)+'</td><td><button class="b2 detail" data-no="'+e.employeeNo+'">View</button></td></tr>'}).join("")+'</table></div></div><div id="detail"></div>';
$("#date").onchange=e=>{selectedDate=e.target.value;monitor()};$("#search").oninput=()=>{let v=$("#search").value;monitor().then(()=>{let s=$("#search");s.value=v;s.focus();s.setSelectionRange(v.length,v.length)})};
const show=no=>{let r=rs[no],e=es.find(z=>z.employeeNo===no);if(!e)return;openNo=no;$("#detail").innerHTML='<div class="card"><h3>'+esc(e.name)+' · '+no+' — Timeline</h3>'+timeline(r)+'<h3>Individual Work ID History</h3>'+sessions(r)+'</div>'};document.querySelectorAll(".detail").forEach(b=>b.onclick=ev=>{ev.preventDefault();show(b.dataset.no)});if(openNo)show(openNo);
}
async function employeeAdmin(){let x=await api("employees");$("#main").innerHTML='<h2>Employee Management</h2><p class="mu">Imported names have generated employee numbers. Employees sign in with the default password OGI@2026 until you reset it.</p><div class="card"><h3>Add Employee</h3><div class="g"><label>Name<input id="ename"></label><label>Initial Password<input id="epin" type="password"></label></div><button id="add" class="b">Create Employee</button></div><div class="card"><h3>Add Many Employees</h3><p class="mu">One name per line. Everyone gets the default password OGI@2026.</p><textarea id="names" rows="5" style="width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;font:inherit"></textarea><br><br><button id="bulk" class="b">Create All</button></div><div class="card"><h3>Employee Accounts</h3><div class="tw"><table><tr><th>Name</th><th>Employee Number</th><th>Password</th><th>Action</th></tr>'+x.employees.map(e=>'<tr><td>'+esc(e.name)+'</td><td>'+e.employeeNo+'</td><td>'+(e.pinHash?"Configured":"Not set")+'</td><td><button class="b2 setpin" data-no="'+e.employeeNo+'">Set / Reset Password</button></td></tr>').join("")+'</table></div></div><div class="card"><h3>Work ID Catalogue</h3>'+((boot.workIds||[]).map(i=>'<span class="pill">'+esc(i)+'</span>').join(" "))+'</div>';
$("#add").onclick=async()=>{try{let r=await api("employees","POST",{name:$("#ename").value,pin:$("#epin").value});toast("Created "+r.employee.employeeNo);employeeAdmin()}catch(e){toast(e.message)}};
$("#bulk").onclick=async()=>{try{let names=$("#names").value.split("\n").map(z=>z.trim()).filter(Boolean);let r=await api("employees","POST",{names});toast("Created "+r.employees.length+" employees");employeeAdmin()}catch(e){toast(e.message)}};
document.querySelectorAll(".setpin").forEach(b=>b.onclick=async()=>{let p=prompt("New password for "+b.dataset.no);if(p===null)return;try{await api("set-pin","POST",{employeeNo:b.dataset.no,pin:p});toast("Password saved");employeeAdmin()}catch(e){toast(e.message)}})}
let rng="today",rFrom=null,rTo=null,repEmp=null;
const addDays=(d,n)=>{let t=new Date(d+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
async function reports(){
let t=today(),f,to=t;
if(rng==="today")f=t;else if(rng==="week")f=addDays(t,-6);else if(rng==="month")f=addDays(t,-29);else if(rng==="3m")f=addDays(t,-89);else if(rng==="all")f="2000-01-01";else{f=rFrom||t;to=rTo||t}
let x=await api("report","GET",null,{from:f,to}),S={};
const mk=(no,name)=>S[no]||(S[no]={name,no,days:new Set(),work:0,brk:0,ids:{},rows:[]});
x.employees.forEach(e=>mk(e.employeeNo,e.name));
for(const d of x.days)for(const [no,r] of Object.entries(d.employees||{})){let s=mk(no,r.name);s.days.add(d.date);s.brk+=(r.breaks||[]).reduce((a,b)=>a+dur(b.startAt,b.endAt),0);for(const w of r.workSessions||[]){let h=dur(w.startAt,w.endAt),i=s.ids[w.workId]||(s.ids[w.workId]={h:0,n:0,d:new Set()});s.work+=h;i.h+=h;i.n++;i.d.add(d.date);s.rows.push([d.date,w.workId,w.startAt,w.endAt,h])}}
let L=Object.values(S),btn=(k,l)=>'<button class="'+(rng===k?"b":"b2")+' rng" data-k="'+k+'">'+l+'</button>',allW=L.reduce((a,s)=>a+s.work,0);
let m='<h2>Reports</h2><div class="bar">'+btn("today","Today")+btn("week","1 Week")+btn("month","1 Month")+btn("3m","3 Months")+btn("all","All Time")+'</div><div class="bar"><label>From<input type="date" id="from" value="'+f+'"></label><label>To<input type="date" id="to" value="'+to+'"></label><button id="apply" class="b2">Custom range</button><button id="csv" class="b2">Download CSV</button></div><p class="mu">'+(rng==="all"?"All time":f+" to "+to)+' · click an employee name for full details</p><div class="kpis">'+stat("Employees with activity",L.filter(s=>s.days.size).length)+stat("Total Work Hours",hours(allW))+stat("Total Sessions",L.reduce((a,s)=>a+s.rows.length,0))+'</div>';
m+='<div class="card"><h3>All Employees</h3><div class="tw"><table><tr><th>Employee</th><th>No.</th><th>Days Present</th><th>Work IDs</th><th>Sessions</th><th>Total Work Hours</th><th>Total Break</th></tr>'+L.map(s=>'<tr><td><a href="#reports" class="emp" data-no="'+s.no+'"><b>'+esc(s.name)+'</b></a></td><td>'+s.no+'</td><td>'+s.days.size+'</td><td>'+Object.keys(s.ids).length+'</td><td>'+s.rows.length+'</td><td>'+hours(s.work)+'</td><td>'+hours(s.brk)+'</td></tr>').join("")+'</table></div></div>';
let s=S[repEmp];
if(s){let ids=Object.entries(s.ids).sort((a,b)=>b[1].h-a[1].h),bd={};s.rows.forEach(r=>bd[r[0]]=(bd[r[0]]||0)+r[4]);
m+='<div class="card"><h3>'+esc(s.name)+' · '+s.no+'</h3><div class="kpis">'+stat("Days Present",s.days.size)+stat("Total Work Hours",hours(s.work))+stat("Work IDs Used",ids.length)+stat("Total Break",hours(s.brk))+'</div><h3>Hours per Work ID</h3><div class="tw"><table><tr><th>Work ID</th><th>Total Hours</th><th>Sessions</th><th>Days</th></tr>'+ids.map(([k,i])=>'<tr><td>'+esc(k)+'</td><td>'+hours(i.h)+'</td><td>'+i.n+'</td><td>'+i.d.size+'</td></tr>').join("")+'</table></div><h3>Daily Total</h3><div class="tw"><table><tr><th>Date</th><th>Hours</th></tr>'+Object.entries(bd).map(([d,h])=>'<tr><td>'+d+'</td><td>'+hours(h)+'</td></tr>').join("")+'</table></div><h3>Every Session</h3><div class="tw"><table><tr><th>Date</th><th>Work ID</th><th>Start</th><th>End</th><th>Duration</th></tr>'+s.rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+esc(r[1])+'</td><td>'+fmt(r[2])+'</td><td>'+fmt(r[3])+'</td><td>'+hours(r[4])+'</td></tr>').join("")+'</table></div></div>'}
$("#main").innerHTML=m;
document.querySelectorAll(".rng").forEach(b=>b.onclick=()=>{rng=b.dataset.k;reports()});
document.querySelectorAll(".emp").forEach(a=>a.onclick=e=>{e.preventDefault();repEmp=a.dataset.no;reports()});
$("#apply").onclick=()=>{rng="custom";rFrom=$("#from").value;rTo=$("#to").value;reports()};
$("#csv").onclick=()=>{let c=[["Date","Employee","Employee No","Work ID","Start","End","Hours"]];L.forEach(s=>s.rows.forEach(r=>c.push([r[0],s.name,s.no,r[1],r[2],r[3]||"",r[4].toFixed(2)])));let u=URL.createObjectURL(new Blob([c.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(",")).join("\n")],{type:"text/csv"})),a=document.createElement("a");a.href=u;a.download="ogi-report-"+f+"-to-"+to+".csv";a.click()};
}
(async()=>{try{let x=await api("me");user=x.user;await load()}catch{loginView()}})();
</script></main></div></body></html>
